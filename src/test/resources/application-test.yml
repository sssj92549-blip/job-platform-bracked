spring:
  sql:
    init:
      mode: always
      schema-locations: classpath:auth-schema.sql,classpath:recruitment-schema.sql
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:job_platform;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
management:
  health:
    redis:
      enabled: false
app:
  jobs:
    enabled: false
